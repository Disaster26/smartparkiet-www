<html lang="pl">
<head>
<meta charset="utf-8">

<style>
:root{
  --pom:#FF6A13;--pom-ink:#C2470A;--pom-bg:#FCE4D4;
  --graf:#16120F;--graf2:#211C18;--ink:#17130F;--ink2:#514B45;--ink3:#736D66;
  --tlo:#D5D7DA;--karta:#E9EAEC;--karta2:#E0E2E4;--pole:#F5F6F7;--linia:rgba(23,19,15,.09);--linia2:rgba(23,19,15,.17);--kosc:rgba(23,19,15,.065);
  --t-a:#FF6A13;--t-w:#1E5F9E;--t-k:#1F7A4D;--t-r:#6E675F;
  --r:12px;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --demo:22px;--tab:56px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--tlo);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button,a,[role=button]{touch-action:manipulation}
button,[role=button],.tabs,.chips,.side{-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--pom);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
/* naciśnięcie: krótko, transform */
.ib,.chip,.btn-p,.tabs button,.akcje a,.akcje button,.stg button,.szyb button,.seg button,.dzis-b,.btn-x,.f-dr button,.sw button,.login .btn,.dp button,.zam,.pas-dni button,.linki a,.gtray h4 button,.ust-d,.stp button,.prz .dym .bt .pom,.lk,.ch,.dzien .plus,.gk.gsp .pl,.pal button{transition:transform .12s var(--ease),background-color .12s,color .12s}
.ib:active,.chip:active,.btn-p:active,.tabs button:active,.akcje a:active,.akcje button:active,.stg button:active,.szyb button:active,.seg button:active,.dzis-b:active,.btn-x:active,.f-dr button:active,.sw button:active,.login .btn:active,.dp button:active,.zam:active,.pas-dni button:active,.linki a:active,.gtray h4 button:active,.ust-d:active,.stp button:active,.prz .dym .bt .pom:active,.ch:active,.dzien .plus:active,.gk.gsp .pl:active,.pal button:active{transform:scale(.97)}

/* pasek stanu synchronizacji */
.demo{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:var(--st);background:var(--graf);color:#A39A90;font-size:11px;letter-spacing:.01em}
.demo .in{height:var(--demo);display:flex;align-items:center;justify-content:center;gap:7px}
.demo b{color:#F2EDE6;font-weight:600}
.demo i{width:6px;height:6px;border-radius:50%;background:#8A8178;display:inline-block}
.demo.ok i{background:#3CCB7F}.demo.zap i{background:#FFC53D}.demo.off i,.demo.blad i{background:#FF5A5F}
.demo.off,.demo.blad{background:#4A1D18;color:#F2D9D4}
.demo button{color:inherit;text-decoration:underline;text-underline-offset:2px;font-size:11px;margin-left:6px}
.wyl{display:block;margin:4px auto 0;min-height:44px;padding:0 12px;font-size:14px;color:var(--ink3)}
.side .wyl{margin:6px 0 0;padding:0 12px;text-align:left;color:#8A8178;font-size:13.5px;min-height:40px}
.linki{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linki a{flex:1 1 140px;height:44px;border-radius:10px;background:var(--pole);box-shadow:inset 0 0 0 1px var(--linia);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink)}
.linki a svg.i{width:18px;height:18px;color:var(--ink2)}
.ladow{padding:60px 24px;text-align:center;color:var(--ink3)}

/* logowanie */
.login{position:fixed;inset:0;z-index:80;background:var(--graf);color:#F2EDE6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(32px + var(--st)) 24px calc(32px + var(--sb))}
.login img{width:60px;height:60px}
.login h2{font-size:26px;font-weight:700;margin:20px 0 2px;letter-spacing:-.02em}
.login h1{font-size:14px;font-weight:500;margin:0 0 28px;color:#8F867C;letter-spacing:0}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.login input{height:52px;border-radius:12px;border:1px solid #39322C;background:var(--graf2);color:#F2EDE6;padding:0 16px;font-size:16px}
.login input::placeholder{color:#7D756C}
.login input:focus{outline:none;border-color:var(--pom)}
.login .btn{height:52px;border-radius:12px;background:var(--pom);color:#fff;font-weight:650;font-size:16px}
.login .btn:disabled{opacity:.7}
.login p{font-size:13px;color:#7D756C;margin:16px 0 0;text-align:center;max-width:300px}
.login .err{color:#FF8C7A;min-height:18px;margin:12px 0 0}

/* układ */
.app{position:fixed;inset:0;padding-top:calc(var(--demo) + var(--st));display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--tab) + var(--sb) + 20px)}
.top{position:sticky;top:0;z-index:5;background:rgba(213,215,218,.9);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);padding:14px 16px 10px;border-bottom:.5px solid var(--linia2)}
.top-r{display:flex;align-items:center;gap:10px;min-height:40px}
.top-r img{width:28px;height:28px;display:none}
.v-dzis .top-r img{display:block}
.top h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.025em;flex:1;min-width:0;line-height:1.15}
.top .sub{font-size:13px;color:var(--ink3);white-space:nowrap}

/* filtry */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:9px;background:var(--kosc);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip .n{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--graf);color:#fff}
.chip.on .n{color:#A9A096}

/* lista */
.lista{padding:12px 12px;display:flex;flex-direction:column;gap:6px}
.karta{position:relative;background:var(--karta);border-radius:var(--r);padding:12px 14px 12px 17px;text-align:left;width:100%;display:block;overflow:hidden;transition:background-color .12s}
.karta::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--tc)}
.karta.sel{background:var(--pole);box-shadow:inset 0 0 0 1.5px var(--graf)}
.karta:active{background:var(--karta2)}
.k1{display:flex;align-items:baseline;gap:10px}
.k1 .nm{font-weight:650;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.k1 .zl{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.k2{font-size:14px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k3{display:flex;align-items:center;gap:6px 10px;margin-top:8px;flex-wrap:wrap;min-width:0}
.typ{font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.typ::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--tc);flex:none}
.kiedy{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.kiedy .typ{color:var(--ink3)}
.kiedy .typ::before{display:none}
.nowe{display:inline-block;font-size:11.5px;font-weight:650;color:var(--pom-ink);background:var(--pom-bg);border-radius:5px;padding:1px 6px;vertical-align:2px;line-height:1.35}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc);flex:none}
.dz{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dz svg.i{width:14px;height:14px;color:var(--ink2)}
.pusto{text-align:center;color:var(--ink3);padding:48px 24px;font-size:14px}

/* dolny pasek */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(233,234,236,.92);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:.5px solid var(--linia2);display:flex;padding:0 max(4px,env(safe-area-inset-right,0px)) var(--sb) max(4px,env(safe-area-inset-left,0px));transition:transform .2s var(--ease)}
.tabs button{flex:1;min-width:0;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);position:relative;letter-spacing:.005em}
.tabs button svg.i{width:24px;height:24px;stroke-width:1.7}
.tabs button.on{color:var(--pom-ink)}
.tabs button.on svg.i{stroke-width:2}
.bdg{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--pom);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px rgba(233,234,236,.95)}
.tabs .plus-t{color:var(--ink2)}
.tabs .plus-t span{width:46px;height:30px;border-radius:10px;background:var(--pom);color:#fff;display:flex;align-items:center;justify-content:center}
.tabs .plus-t span svg.i{width:20px;height:20px;stroke-width:2.4}

/* szczegóły / panel dnia: na telefonie pełny ekran */
.det{position:fixed;inset:0;z-index:40;background:var(--tlo);transform:translateX(100%);visibility:hidden;transition:transform .2s var(--ease),visibility 0s linear .2s;display:flex;flex-direction:column;padding-top:calc(var(--demo) + var(--st))}
.det.open{transform:none;visibility:visible;transition:transform .2s var(--ease),visibility 0s}
.det-h{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 12px 4px 4px;border-bottom:.5px solid var(--linia2);background:rgba(213,215,218,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.det-h .wst{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 6px;font-weight:600;font-size:16px;color:var(--pom-ink)}
.det-h .wst svg.i{width:22px;height:22px;stroke-width:2.2}
.det-h .t{flex:1;min-width:0;font-size:13px;color:var(--ink3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det-b{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 16px calc(var(--sb) + 32px)}
.det-pusto{display:none}
.hd h2{font-size:26px;margin:0 0 4px;letter-spacing:-.025em;line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.hd .adr{color:var(--ink2);font-size:15px;overflow-wrap:anywhere}
.hd .src{margin-top:6px}
.hd .src .typ{font-size:13px}
.hd .kw{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.hd .kw b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hd .kw span{font-size:14px;color:var(--ink3)}
.akcje{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 4px}
.akcje a,.akcje button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:64px;border-radius:12px;background:var(--karta);font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);min-width:0;padding:0 4px;text-align:center;line-height:1.15}
.akcje .tel{background:var(--pom);color:#fff}
.akcje svg.i{width:22px;height:22px}
.tel-n{font-size:14px;color:var(--ink2);text-align:center;margin-top:6px}
.tel-n a{font-weight:600;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;display:inline-block;padding:6px 10px}
.sek{margin-top:22px}
.sek h3{font-size:15px;color:var(--ink);margin:0 0 10px;font-weight:650;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.sek h3 .ok{margin-left:auto;color:var(--t-k);font-weight:500;font-size:13px;opacity:0;transition:opacity .2s}
.sek h3 .ok.on{opacity:1}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stg button{min-height:44px;border-radius:10px;background:var(--karta);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:9px;padding:0 12px;text-align:left;color:var(--ink)}
.stg button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.stg button.on{background:var(--sc);color:#fff;font-weight:600}
.stg button.on::before{background:#fff}
textarea{width:100%;min-height:96px;border:1px solid var(--linia2);border-radius:10px;padding:11px 12px;font-size:16px;resize:vertical;background:var(--pole);line-height:1.45}
textarea:focus,input:focus,select:focus{outline:2px solid var(--pom);outline-offset:-1px}
.term{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.term input,.dp input,.dp select{height:46px;border:1px solid var(--linia2);border-radius:10px;padding:0 12px;font-size:16px;background:var(--pole);min-width:0}
.term input[type=date]{flex:1 1 150px}
.term input[type=time]{flex:0 0 116px}
.szyb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.szyb button{height:40px;padding:0 14px;border-radius:9px;background:var(--karta);font-size:14px;font-weight:600}
.szyb button.usun{background:none;color:#A2382D;padding:0 8px;font-weight:500}
.term-info{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.term-info svg.i{color:var(--ink2)}
.poz{width:100%;border-collapse:collapse;font-size:14px}
.poz td{padding:8px 0;border-bottom:1px solid var(--linia);vertical-align:top}
.poz td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.poz small{color:var(--ink3);display:block}
.poz tr.suma td{border:0;font-weight:700;padding-top:10px}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--ink2)}
.hist li{padding:5px 0 5px 16px;position:relative}
.hist li::before{content:"";position:absolute;left:1px;top:12px;width:6px;height:6px;border-radius:50%;background:#AEB1B5}
.hist time{color:var(--ink3);font-variant-numeric:tabular-nums}

/* kalendarz */
.kal-nav{display:flex;align-items:center;gap:4px;margin-top:10px}
.kal-nav .lb{flex:1;font-weight:650;font-size:16px;min-width:0}
.ib{width:40px;height:40px;border-radius:10px;background:var(--kosc);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.seg{display:flex;background:var(--kosc);border-radius:9px;padding:2px}
.seg button{height:32px;padding:0 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--pole);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dzis-b{height:40px;padding:0 13px;border-radius:10px;background:var(--kosc);font-size:14px;font-weight:600;flex:none}
.tray{padding:14px 16px 2px}
.tray h4{margin:0 0 8px;font-size:15px;font-weight:650;color:var(--ink)}
.tray h4 span{display:block;font-weight:400;font-size:13px;margin-top:1px;color:var(--ink3)}
.tray .chips{margin-top:0}
.ch{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 9px;border-radius:9px;background:var(--karta);font-size:14px;font-weight:600;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;white-space:nowrap;color:var(--ink)}
.ch::before{content:"";width:3px;height:18px;border-radius:2px;background:var(--tc);flex:none}
.ch.wyb{background:var(--graf);color:#fff}
.wybor{margin:10px 16px 0;padding:10px 12px;background:var(--pom-bg);border-radius:10px;font-size:14px;display:flex;align-items:center;gap:8px}
.wybor b{flex:1;font-weight:600;min-width:0}
.wybor button{font-weight:600;color:var(--pom-ink);min-height:36px;padding:0 4px}

.tydz{padding:12px 12px;display:flex;flex-direction:column;gap:6px}
.dzien{display:flex;gap:10px;background:var(--karta);border-radius:12px;padding:10px;min-height:64px;transition:background-color .12s,box-shadow .12s}
.dzien .dn{width:44px;flex:none;text-align:center;padding-top:2px}
.dzien .dn small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.dzien .dn b{font-size:20px;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums}
.dzien.dzis .dn b{color:#fff;background:var(--pom);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.dzien.wkend{background:var(--karta2)}
.dzien .wp{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dzien .plus{align-self:flex-start;width:40px;height:40px;margin:-4px -4px 0 0;border-radius:10px;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex:none}
.wpis{display:flex;align-items:center;gap:8px;border-radius:8px;padding:7px 9px;background:var(--pole);font-size:13.5px;text-align:left;width:100%;min-width:0;box-shadow:inset 3px 0 0 var(--tc);touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;color:var(--ink)}
.wpis .g{font-weight:650;font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}
.wpis .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpis .x small{color:var(--ink2);font-size:12.5px}
.wpis.reka{background:transparent;box-shadow:inset 3px 0 0 var(--t-r),inset 0 0 0 1px var(--linia2)}
[data-day].nad{background:var(--pom-bg)!important;box-shadow:inset 0 0 0 1.5px var(--pom)!important}
.cel [data-day]{outline:1px dashed var(--pom);outline-offset:-3px}

.mies{padding:10px 8px 0}
.mies .naz{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--ink3);text-align:center;padding:4px 0 6px}
.mies .siat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.kom{min-height:76px;background:var(--karta);border-radius:8px;padding:4px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.kom .nr{font-size:12.5px;font-weight:600;padding-left:3px;font-variant-numeric:tabular-nums}
.kom.inny{background:transparent}
.kom.inny .nr{color:#A9ACB0}
.kom.dzis .nr{color:var(--pom-ink);font-weight:750}
.kom.dzis{box-shadow:inset 0 0 0 1.5px var(--pom)}
.kom .p{font-size:10.5px;line-height:1.3;border-radius:4px;padding:1px 3px;background:var(--pole);box-shadow:inset 2px 0 0 var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kom .wiecej{font-size:10.5px;color:var(--ink3);padding-left:3px}

/* okna (arkusz od dołu) */
.okno{position:fixed;inset:0;z-index:70;background:rgba(16,13,10,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out}
.okno .in{background:var(--karta);width:100%;max-width:560px;max-height:calc(100dvh - var(--st) - 24px);overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + var(--sb));animation:up .2s var(--ease)}
.okno h3{margin:0 0 14px;font-size:18px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.okno h3 span{flex:1;min-width:0}
.okno .zam{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--kosc);margin:-4px -4px -4px 0;color:var(--ink2)}
.dane{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:15px;margin:0}
.dane dt{color:var(--ink3);font-size:13.5px;padding-top:1px}
.dane dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.btn-p{height:50px;border-radius:12px;background:var(--graf);color:#fff;font-weight:650;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.btn-p.pom{background:var(--pom)}
.arkusz{border:1px solid var(--linia);border-radius:6px;padding:22px 20px;font-size:12.5px;background:var(--pole)}
.arkusz .ah{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--pom);padding-bottom:12px;margin-bottom:12px}
.arkusz .ah img{width:34px;height:34px}
.arkusz .ah b{font-size:14px;letter-spacing:.12em}
.arkusz .ah span{margin-left:auto;text-align:right;color:var(--ink2);font-size:11.5px}
.arkusz h4{margin:12px 0 4px;font-size:15px}
.arkusz .uw{color:var(--ink3);font-size:11px;margin-top:14px}
.dp{display:flex;gap:6px;margin-top:8px}
.dp input[type=text]{flex:1}
.dp button{height:46px;padding:0 16px;border-radius:10px;background:var(--graf);color:#fff;font-weight:600;flex:none}
.dp select{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 12px);transform:translate(-50%,8px);background:var(--graf);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:opacity .18s ease-out,transform .18s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.duch{position:fixed;z-index:95;pointer-events:none;transform:translate(-50%,-120%) rotate(-1.5deg);box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:.96}
.szuk{display:flex;align-items:center;gap:8px;height:44px;border-radius:10px;background:var(--kosc);padding:0 12px;margin-top:10px}
.szuk input{flex:1;border:0;height:42px;font-size:16px;background:none;min-width:0}
.szuk input:focus{outline:none}
.szuk:focus-within{background:var(--pole);box-shadow:inset 0 0 0 1.5px var(--pom)}
.szuk svg.i{color:var(--ink3)}
mark{background:#FFD9C2;color:inherit;border-radius:3px;padding:0 1px}

/* ekran Dziś */
.dzis-w{padding:4px 12px 8px}
.blok{margin-top:20px}
.blok:first-child{margin-top:10px}
.blok>h3{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-size:18px;font-weight:700;letter-spacing:-.015em;min-height:32px}
.blok>h3 .n{font-size:15px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:0}
.blok>h3 .n.pom{font-size:12px;font-weight:700;color:#fff;background:var(--pom);border-radius:9px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.blok>h3 small{font-weight:400;color:var(--ink3);font-size:14px;letter-spacing:0}
.blok>h3 a,.blok>h3 button.lk{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink2);min-height:36px;padding:0 4px;letter-spacing:0;white-space:nowrap}
.wier{display:flex;align-items:stretch;background:var(--karta);border-radius:12px;overflow:hidden;margin-bottom:6px}
.wier>button.w0{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:12px 6px 12px 15px;text-align:left;box-shadow:inset 3px 0 0 var(--tc);transition:background-color .12s}
.wier>button.w0:active{background:var(--karta2)}
.wier .gz{width:48px;flex:none;font-weight:650;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.2}
.wier .gz small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
.wier .tx{flex:1;min-width:0}
.wier .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:650;letter-spacing:-.01em}
.wier .tx>span{display:block;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wier .tx>span+span{font-size:13px}
.wier .tx>.st{display:inline-flex;margin-top:6px;font-size:12.5px}
.wier a.dzw{width:56px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;position:relative}
.wier a.dzw::before{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:var(--kosc);transition:transform .12s var(--ease),background-color .12s}
.wier a.dzw:active::before{transform:scale(.92);background:rgba(23,19,15,.12)}
.wier a.dzw svg.i{width:20px;height:20px;position:relative}
.czek{font-size:13px;font-weight:650;color:var(--pom-ink)}
.pas-dni{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pas-dni button{background:var(--karta);border-radius:10px;padding:8px 2px 7px;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:600;min-height:62px}
.pas-dni button b{display:block;font-size:17px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;margin-top:1px}
.pas-dni button i{display:flex;justify-content:center;gap:3px;margin-top:5px;min-height:5px}
.pas-dni button i u{width:5px;height:5px;border-radius:50%;background:var(--tc);display:block}
.pas-dni button.dz0{box-shadow:inset 0 0 0 1.5px var(--pom)}
.pas-dni button.dz0 b{color:var(--pom-ink)}
.pas-dni button.min{opacity:.5}
.przew-lk{display:block;margin:24px auto 0;min-height:44px;padding:0 12px;font-size:14px;color:var(--ink2);font-weight:500}
.side .plus-s{margin-top:14px;background:var(--pom)!important;color:#fff!important;justify-content:flex-start}
.form label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.form input,.form textarea,.form select{width:100%;height:46px;border:1px solid var(--linia2);border-radius:10px;padding:0 12px;font-size:16px;background:var(--pole);min-width:0}
.form textarea{height:auto;min-height:76px;padding:11px 12px}
.form .r2{display:flex;gap:8px}.form .r2>div{flex:1;min-width:0}
.seg.pelny{width:100%;margin-bottom:2px}.seg.pelny button{flex:1;height:36px}

/* przewodnik */
.prz{position:fixed;inset:0;z-index:100}
.prz .dz-r{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(16,13,10,.58);transition:left .2s var(--ease),top .2s var(--ease),width .2s var(--ease),height .2s var(--ease);pointer-events:none}
.prz .dym{position:fixed;left:16px;right:16px;max-width:360px;background:var(--pole);border-radius:14px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.24);transition:top .2s var(--ease)}
.prz .dym h4{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.prz .dym p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.45}
.prz .dym .bt{display:flex;gap:12px;align-items:center;margin-top:14px}
.prz .dym .bt .kr{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prz .dym .bt .pom{margin-left:auto;height:44px;padding:0 20px;border-radius:10px;background:var(--pom);color:#fff;font-weight:650}
.prz .dym .bt .pmn{font-size:14px;color:var(--ink2);min-height:44px;padding:0 4px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(32px);opacity:0}}

/* grafik brygad */
.g-nav{display:flex;align-items:center;gap:4px;margin-top:10px}
.g-nav .lb{flex:1;text-align:center;font-weight:650;font-size:15px;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nav .lb small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.g-nav .ib{width:38px}
.g-nav .dzis-b{padding:0 11px}
.btn-x{height:40px;padding:0 12px;border-radius:10px;background:var(--kosc);color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn-x svg.i{width:18px;height:18px;color:#1D6F42}
.g-leg{display:flex;gap:6px 14px;margin:10px -16px 0;padding:0 16px;font-size:12.5px;color:var(--ink2);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.g-leg::-webkit-scrollbar{display:none}
.g-leg span{display:inline-flex;align-items:center;gap:6px;flex:none}
.g-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.gwrap{padding:12px 4px 0}
.gtray{padding:0 6px 10px}
.gtray h4{margin:0 0 8px;font-size:15px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px}
.gtray h4 b{background:var(--pom);color:#fff;border-radius:9px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.gtray h4 button{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 9px;border-radius:9px;background:var(--kosc)}
.gtray h4 button svg.i{width:17px;height:17px;stroke-width:2.2}
.gtray .chips{margin:0 -12px;padding:0 12px}
.gtray .ch small{font-weight:500;color:var(--ink3)}
.gtray .ch.wyb small{color:#BDB4A9}
.gtray>div:last-child{font-size:12.5px!important;color:var(--ink3);margin-top:8px!important;line-height:1.4}
.gsiat{display:grid;grid-template-columns:26px repeat(var(--nb),minmax(0,1fr));gap:3px;padding-bottom:2px}
.gsiat::-webkit-scrollbar{display:none}
.gh{font-size:9px;font-weight:700;letter-spacing:-.01em;text-align:center;padding:7px 1px;background:var(--graf);color:#fff;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh.g0{background:none}
.gsiat>*{grid-row:var(--rm)}
.gh.gsp{display:none}
.gk.gsp.pusta{display:none}
.gk.gn{min-height:30px;padding:2px;gap:2px;background:rgba(23,19,15,.035);justify-content:center}
.gk.gn .gn-p{display:flex;align-items:center;justify-content:center;gap:2px;height:24px;color:#9A9590;font-size:10.5px;font-weight:600}
.gk.gn .gn-p svg.i{width:12px;height:12px}
.gk.gn .gw{display:block;width:100%;min-height:24px;height:auto;padding:4px 5px;font-size:10.5px;line-height:1.25;white-space:normal;overflow-wrap:anywhere;border-radius:5px}
.gk.gn .gw svg.i{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.gk.gn .gw b{margin-right:3px}
.ark-ok{margin-top:8px;font-size:13px;color:var(--t-k)}
.hd .kd-ts{color:var(--ink3);font-size:13px;font-weight:400}
.hd-inf{margin:14px 0 0;padding:12px 14px;background:var(--karta);border-radius:12px;font-size:14.5px;gap:6px 14px}
.hd-inf dt{font-size:13px;padding-top:2px}
.hd-inf dd.wazne{color:var(--ink);font-weight:650}
.gdn{display:flex;flex-direction:column;align-items:center;padding-top:8px;font-size:10px;font-weight:600;color:var(--ink3);background:var(--karta);border-radius:7px}
.gdn b{font-size:15px;color:var(--ink);line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.gdn.dzis{background:var(--pom);color:#FFE3D2}.gdn.dzis b{color:#fff}
.gdn.min{color:#9A9590}.gdn.min b{color:var(--ink3)}
.gk{background:var(--karta2);border-radius:7px;padding:2px;min-height:72px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .12s,box-shadow .12s}
.gk.sob{background:#D5D8DC}.gk.gn.sob{background:#DFE2E5}.gdn.sob{background:#D5D8DC;color:#3F444A}/* soboty lekko grafitowe - Artur 14.11 */
.gk.dz{box-shadow:inset 0 0 0 1px rgba(255,106,19,.45)}
.gk.gsp{grid-column:2/-1;gap:3px;min-height:34px;flex-direction:row;flex-wrap:wrap;align-items:center;padding:3px;background:rgba(23,19,15,.035);box-shadow:none}
.gk.gsp .pl{height:28px;padding:0 8px;border-radius:6px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.gk.gsp .pl svg.i{width:14px;height:14px}
.kf{position:relative;display:block;text-align:left;border-radius:5px;padding:5px 4px 5px 5px;background:var(--kc);color:var(--kt);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);font-size:11px;line-height:1.25;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;min-width:0;overflow:hidden;width:100%;text-transform:uppercase}
.kf b{display:block;font-size:11px;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;font-weight:700;letter-spacing:0;line-height:1.22}
.kf .tl{display:block;font-variant-numeric:tabular-nums;font-weight:600;opacity:.8;margin-top:3px;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kf .kd{float:right;position:relative;margin:-3px -3px 0 1px;width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:inherit}
.kf .kd::after{content:"";position:absolute;inset:-8px -6px -12px -12px}
.kf .kd::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;opacity:.55;background:rgba(255,255,255,.25)}
.kf .nd{display:inline-block;font-style:normal;font-size:9px;font-weight:700;background:rgba(0,0,0,.16);color:inherit;border-radius:4px;padding:0 4px;margin-bottom:3px;letter-spacing:.02em}
.kf.cd{opacity:.92}
.kf .st-n{display:block;font-size:9.5px;font-weight:700;opacity:.75;margin-top:2px;letter-spacing:.03em}
.pal{position:fixed;z-index:75;background:var(--pole);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08);padding:12px;width:min(320px,calc(100vw - 24px));animation:fade .12s ease-out}
.pal h6{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--ink2)}
.pal .ps{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.pal .ps button{height:40px;border-radius:8px;background:var(--kc);color:var(--kt);font-size:12.5px;font-weight:650;padding:0 9px;text-align:left;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal .ps button.on,.pal .pk button.on{box-shadow:0 0 0 2px var(--pole),0 0 0 4px var(--graf)}
.pal .pk{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pal .pk button{aspect-ratio:1;border-radius:50%;background:var(--kc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.form input.duze{text-transform:uppercase}
.szo{margin:0 0 12px}
.akc{position:sticky;top:-16px;z-index:3;display:flex;gap:8px;margin:14px -16px 4px;padding:10px 16px;background:var(--karta);box-shadow:0 1px 0 var(--linia)}
.akc button{height:46px;border-radius:12px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--ease)}
.akc button:active{transform:scale(.97)}
.akc .akc-n{flex:0 0 auto;padding:0 14px;background:var(--kosc);color:var(--ink)}
.akc .akc-n.cz{color:#A2382D}
.akc .akc-n svg.i{width:18px;height:18px}
.akc .akc-z,.qi .akc-z{flex:1;background:var(--pom);color:#fff}
.of-z .ofx{font-weight:500;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;font-size:13px}
.qi{display:flex;gap:8px}
.qi input{flex:1;min-width:0;height:48px;border:1px solid var(--linia2);border-radius:12px;padding:0 12px;font-size:16px;background:var(--pole)}
.qi .akc-z{flex:0 0 auto;height:48px;padding:0 18px;border-radius:12px;font-weight:650;font-size:15px}
.qi-w{display:block;margin:10px 0 0;min-height:40px;font-size:14px;color:var(--ink2);font-weight:500}
.kop-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + var(--sb) + 10px);z-index:35;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;background:var(--graf);color:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s var(--ease)}
.gsiat.cel .gk.gn,.gsiat.cel .gk.gsp{outline:none}
body:has(.kop-bar) .toast{bottom:calc(var(--tab) + var(--sb) + 92px)}
body:has(.okno) .toast{top:calc(var(--demo) + var(--st) + 12px);bottom:auto}
.kop-bar span{flex:1;min-width:0;font-size:14px;line-height:1.3}
.kop-bar b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kop-bar small{display:block;color:#BDB4A9;font-size:12.5px}
.kop-bar button{flex:none;height:40px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.szo .szuk{margin-top:0;background:var(--pole);box-shadow:inset 0 0 0 1px var(--linia2)}
.szo .szuk input::-webkit-search-cancel-button{filter:grayscale(1)}
.szo .szuk:focus-within{box-shadow:inset 0 0 0 1.5px var(--pom)}
.szo-w{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.szo-w:empty{display:none}
.of{display:flex;flex-direction:column;gap:1px;text-align:left;width:100%;min-height:56px;padding:9px 12px;border-radius:10px;background:var(--pole);box-shadow:inset 0 0 0 1px var(--linia);transition:transform .12s var(--ease),background-color .12s}
.of:active{transform:scale(.98);background:var(--karta2)}
.of b{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.of span{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of span+span{color:var(--ink3);font-size:12.5px}
.of i{font-style:normal;color:var(--pom-ink);font-weight:600}
.of-0{font-size:14px;color:var(--ink3);padding:8px 4px}
.of-z{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);padding:8px 12px;border-radius:10px;background:var(--pom-bg);min-width:0}
.of-z span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of-z b{color:var(--ink);font-weight:650}
.of-z button{margin-left:auto;font-weight:600;color:var(--pom-ink);min-height:36px;padding:0 4px;flex:none}
.gw{display:inline-flex;align-items:center;justify-content:flex-start;text-align:left;gap:4px;max-width:100%;min-height:28px;padding:0 8px;border-radius:6px;background:var(--pole);box-shadow:inset 0 0 0 1px var(--linia2);font-size:12px;color:var(--ink);touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw b{font-variant-numeric:tabular-nums;font-weight:650}
.gw.prv{color:#55297F;background:#ECE2F5;box-shadow:none}
.gw svg.i{width:13px;height:13px}
.gsiat.cel [data-cel]{outline:1px dashed var(--pom);outline-offset:-3px}

(function(){

/* ---------- daty ---------- */

function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

function dlugo(s){var d=zIso(s);return DNI_P[d.getDay()]+', '+d.getDate()+' '+MIES_D[d.getMonth()];}
function kiedy(ts){var d=new Date(ts),dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()),r=Math.round((DZIS-dd)/864e5);
  var g=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(r===0)return 'dziś '+g; if(r===1)return 'wczoraj '+g; if(r<7)return DNI[d.getDay()]+' '+g;
  return d.getDate()+'.'+('0'+(d.getMonth()+1)).slice(-2);}
function pelnaData(ts){var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()+', '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function zl(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' zł';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- słowniki ---------- */
var TYPY={
  a:{n:'Wycena z analizatora',k:'Analizator',c:'var(--t-a)'},
  w:{n:'Klient wycenił sam na stronie',k:'Wycena klienta',c:'var(--t-w)'},
  k:{n:'Zamówienie z koszyka',k:'Koszyk',c:'var(--t-k)'},

  ['luzne','Luźne zapytanie','#8A8178','#EFEBE6'],

  ['zatw','Zatwierdzone','#1F8A4C','#E3F2EA'],

  ['zrobione','Zrobione','#5C5650','#E8E6E3'],
  ['odpadlo','Odpadło','#A2382D','#F7E4E1']
];
var ST={};STATUSY.forEach(function(s){ST[s[0]]={n:s[1],c:s[2],b:s[3]};});
function stPill(s){var o=ST[s];return '<span class="st" style="--sc:'+o.c+';--sb2:'+o.b+'">'+o.n+'</span>';}
/* 14.11 Artur: pierwsza linia notatki zamiast nazwy statusu na listach (np. "rezerwacja na 26 listopada") */
function skrNt(it){var t=String(it.nt||'').split(String.fromCharCode(10))[0].trim();return t.length>42?t.slice(0,41)+'…':t;}
function pillIt(it){var o=ST[it.st],t=skrNt(it);return '<span class="st'+(t?' st-nt':'')+'" style="--sc:'+o.c+';--sb2:'+o.b+'" title="'+esc(o.n)+'">'+(t?esc(t):o.n)+'</span>';}

/* ---------- dane z serwera (Apps Script katalog.gs) ---------- */
var API=(function(){var h=location.hostname;if(h==='localhost'||h==='127.0.0.1'){var q=new URLSearchParams(location.search).get('api');return q||location.origin+'/api';}return 'https://script.google.com/macros/s/AKfycbxC1j9MytYHxqD-ONdcd8Bar5SxnAVnmr8pxP1_pdEEIZzB1hbh9AXRDtXEg5hX0QXzDA/exec';})();
var KL_TOK='spk-app-token',KL_KESZ='spk-app-stan',KL_OST='spk-app-ostatnie';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
var TOK=lsGet(KL_TOK)||'';
/* 14.11: punkt startu ustawiany raz - nowe znikaja dopiero po otwarciu albo 'przejrzane' (synchronizowane), nie po samym wejsciu */ var OSTATNIE=+lsGet(KL_OST)||(Date.now()-3*864e5);if(!lsGet(KL_OST))lsSet(KL_OST,String(OSTATNIE));
function m2(it){return +it.m2||0;}
function kwotaTxt(it){return it.kwota>0?zl(it.kwota):'bez wyceny';}
function adrTxt(it){return [it.ul,it.ds].filter(Boolean).join(', ');}
function adrKr(it){return it.ds||String(it.ul||'').split(',')[0];}
var KAL_KOL_DOM=[{id:'c1',n:'KONTAKT'},{id:'c2',n:'OGLĘDZINY'},{id:'c3',n:'ZLECENIA'}];
function pusty(){return {items:[],wpisy:[],graf:{v:2,br:[],kol:[],k:[]},kal:{kol:klon(KAL_KOL_DOM),k:[]},rev:0};}
function zStanu(st){var kl=st.kal||{};return {items:st.items||[],wpisy:st.wpisy||[],graf:st.graf||{v:2,br:[],kol:[],k:[]},kal:{kol:(kl.kol&&kl.kol.length)?kl.kol:JSON.parse(JSON.stringify(KAL_KOL_DOM)),k:kl.k||[]},rev:st.rev||0};}
function klon(o){return JSON.parse(JSON.stringify(o));}
var BAZA=null,POCZ=null,D=pusty();
(function(){var k=lsGet(KL_KESZ);if(TOK&&k){try{BAZA=zStanu(JSON.parse(k));POCZ=BAZA;D=klon(BAZA);}catch(e){}}})();
var S={v:'dzis',sel:null,dzien:null,fT:'all',fS:'otwarte',kt:(function(){var t=lsGet('spk-kal-tryb');return /^(dzien|tg|tydz|mies)$/.test(t||'')?t:'dzien';})(),kalWst:null,kd:DZIS,q:'',wyb:null};
var OTWARTE=function(i){return i.st!=='zrobione'&&i.st!=='odpadlo';};
function item(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null;}
function wpis(id){for(var i=0;i<D.wpisy.length;i++)if(D.wpisy[i].id===id)return D.wpisy[i];return null;}
function czyNowe(it){return !it.widz&&it.ts>OSTATNIE;}
function log(it,x){it.hist=(it.hist||[]).concat([{ts:Date.now(),x:x}]).slice(-60);}

/* ---------- synchronizacja: zmiany liczone jako różnica względem stanu z serwera ---------- */
var LOT=null,BRUD=false,OFF=false,tZap=null,ODLOZ=false;
var POLA_ZAP=['st','nt','dz','g','widz','hist'];
function rekZap(x){if(x.reczne||x.typ==='r'){var o=klon(x);delete o.id;o.reczne=true;return o;}var p={};POLA_ZAP.forEach(function(k){p[k]=x[k]===undefined?null:x[k];});return p;}
function bezId(x){var o=klon(x);delete o.id;return o;}
function roznice(A,B){
  var ops=[];
  function por(t,a,b,f){var ma={},mb={};(a||[]).forEach(function(x){ma[x.id]=x;});(b||[]).forEach(function(x){mb[x.id]=x;});
    Object.keys(mb).forEach(function(id){var nb=f(mb[id]);if(!ma[id]||JSON.stringify(f(ma[id]))!==JSON.stringify(nb))ops.push({t:t,id:id,d:nb});});
    Object.keys(ma).forEach(function(id){if(!mb[id])ops.push({t:t,id:id,d:null});});}
  por('zap',A.items,B.items,rekZap);por('wpis',A.wpisy,B.wpisy,bezId);por('kaf',A.graf.k,B.graf.k,bezId);por('kal',A.kal.k,B.kal.k,bezId);
  if(JSON.stringify(A.kal.kol)!==JSON.stringify(B.kal.kol))ops.push({t:'kalust',d:{kol:B.kal.kol}});
  if(JSON.stringify([A.graf.br,A.graf.kol])!==JSON.stringify([B.graf.br,B.graf.kol]))ops.push({t:'ust',d:{br:B.graf.br,kol:B.graf.kol}});
  return ops;
}
function zastosuj(B,ops){
  ops.forEach(function(op){
    if(op.t==='ust'){B.graf.br=klon(op.d.br);B.graf.kol=klon(op.d.kol);return;}
    if(op.t==='kalust'){B.kal.kol=klon(op.d.kol);return;}
    var arr=op.t==='zap'?B.items:op.t==='wpis'?B.wpisy:op.t==='kal'?B.kal.k:B.graf.k,i=-1;
    arr.forEach(function(x,j){if(x.id===op.id)i=j;});
    if(op.d===null){if(i>=0)arr.splice(i,1);return;}
    var n=Object.assign({},i>=0?arr[i]:{},klon(op.d),{id:op.id});if(i>=0)arr[i]=n;else arr.push(n);
  });
  return B;
}
function zajety(){var ae=document.activeElement;return !!(document.querySelector('.okno,.pal,.prz')||(typeof dr!=='undefined'&&dr&&dr.on)||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.id!=='q'));}
/* stan z serwera trafia do widoku tylko, gdy nic nie jest otwarte (okno, paleta, pisanie) - inaczej czeka */
function scal(){
  if(!BAZA||POCZ===BAZA||LOT)return;
  if(zajety()){ODLOZ=true;return;}
  var L=roznice(POCZ,D);D=zastosuj(klon(BAZA),L);POCZ=BAZA;ODLOZ=false;
  if(S.sel&&!item(S.sel))S.sel=null;
  render(true);
  if(L.length){BRUD=true;planuj();}
}
setInterval(function(){if(ODLOZ)scal();},1500);
function przyjmij(st){BAZA=zStanu(st);lsSet(KL_KESZ,JSON.stringify(BAZA));}
var tSync;
function sync(stan,tx){
  var p=$('pasek');if(!p)return;p.className='demo '+stan;
  var t=new Date(),gg=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  $('syncTx').textContent=tx||(stan==='ok'?'Zapisane i aktualne · '+gg:stan==='zap'?'Zapisuję...':stan==='off'?'Brak internetu: tylko podgląd':stan==='blad'?'Nie zapisano ostatniej zmiany':'Łączenie...');
}
function api(akcja,dane){
  var body=Object.assign({akcja:akcja,token:TOK},dane||{}),ac=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ac)ac.abort();},30000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',cache:'no-store',credentials:'omit',signal:ac?ac.signal:undefined})
    .then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){if(j&&j.kod==='auth'&&akcja!=='katalog_login'){wyloguj(true);throw new Error('auth');}return j;},function(e){clearTimeout(tm);throw e;});
}
function bladSieci(e){var m=String(e&&e.message||e);return !!(e&&(e.name==='TypeError'||e.name==='AbortError'))||/Failed to fetch|NetworkError|Load failed/.test(m);}
function bladTxt(e){var m=String(e&&e.message||e);return bladSieci(e)?'Brak połączenia':/^HTTP/.test(m)?'Serwer chwilowo nie odpowiada':'Nie zapisano: '+m;}
function zapisz(){
  if(!BAZA)return;
  if(OFF){D=zastosuj(klon(POCZ),[]);toast('Brak internetu: zmiany są wyłączone, widzisz ostatni stan');setTimeout(function(){render(true);},0);return;}
  BRUD=true;planuj();
}
function planuj(){clearTimeout(tZap);sync('zap');tZap=setTimeout(wyslij,350);}
var ARK_OK={}; /* zapytania, których arkusz wyceny serwer właśnie zaktualizował (ramka dla ekipy) */
function wyslij(){
  if(LOT||!BAZA)return;
  var T=klon(D),ops=roznice(POCZ,T);BRUD=false;
  if(!ops.length){sync('ok');return;}
  LOT=T;sync('zap');
  api('katalog_zapisz',{ops:ops}).then(function(st){
    if(!st||!st.ok)throw new Error((st&&st.blad)||'Błąd zapisu');
    przyjmij(st);LOT=null;
    if(st.ark&&st.ark.length)st.ark.forEach(function(z){ARK_OK[z]=Date.now();});
    var poz=roznice(T,D);
    if(zajety()){POCZ=T;ODLOZ=true;}else{D=zastosuj(klon(BAZA),poz);POCZ=BAZA;render(true);}
    if(poz.length||BRUD){BRUD=false;planuj();}else sync('ok');
  }).catch(function(e){
    LOT=null;if(String(e.message)==='auth')return;
    D=zastosuj(klon(POCZ),roznice(T,D));render(true);sync('blad');
    toast(bladTxt(e)+'. Zmiana cofnięta, spróbuj jeszcze raz.');
    if(bladSieci(e)){OFF=true;sync('off');}
  });
}
function pobierz(){
  if(!TOK)return Promise.resolve();
  if(LOT||BRUD)return Promise.resolve();
  if(!BAZA)sync('','Wczytuję dane...');
  return api('katalog_stan').then(function(st){
    if(!st||!st.ok)throw new Error((st&&st.blad)||'Błąd serwera');
    OFF=false;var stary=BAZA&&JSON.stringify(BAZA);przyjmij(st);
    if(!POCZ){POCZ=BAZA;D=klon(BAZA);render();migB4();}
    else if(stary!==JSON.stringify(BAZA))scal();
    sync('ok');
  }).catch(function(e){
    if(String(e.message)==='auth')return;
    if(bladSieci(e)){OFF=true;sync('off');if(!BAZA)$('view').innerHTML='<div class="ladow">Brak internetu i brak zapisanych danych.<br>Połącz się i odśwież.</div>';}
    else{sync('blad',bladTxt(e).replace('Nie zapisano: ','Błąd serwera: '));}
  });
}
setInterval(function(){if(document.visibilityState==='visible')pobierz();},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')pobierz();});
window.addEventListener('online',function(){pobierz();});

/* ---------- widok: szukaj ---------- */
function bezPl(s){return String(s).toLowerCase().replace(/[ąćęłńóśźż]/g,function(c){return 'acelnoszz'['ąćęłńóśźż'.indexOf(c)];});}
function cyfry(s){return String(s).replace(/\D/g,'');}
function pasuje(it,q){
  var w=bezPl(q).trim();if(!w)return false;var c=cyfry(q);
  if(c.length>=3&&cyfry(it.tel).indexOf(c)>=0)return true;
  var hay=bezPl([it.kl,it.ul,it.ds,it.nr,it.em,it.nt,it.info].join(' '));
  return w.split(/\s+/).every(function(t){return hay.indexOf(t)>=0;});
}
function hl(txt,q){
  var t=String(txt),bt=bezPl(t),out='',i=0;var toks=bezPl(q).trim().split(/\s+/).filter(function(x){return x.length>=2&&/\D/.test(x);});
  if(cyfry(q).length>=3&&/^[\d\s+-]+$/.test(q.trim())){var cq=cyfry(q);var m=-1;
    for(var a=0;a<t.length&&m<0;a++){var acc='',b=a;while(b<t.length&&acc.length<cq.length){if(/\d/.test(t[b]))acc+=t[b];else if(!acc){break;}b++;}if(acc===cq)m=a,i=b;}
    if(m>=0)return esc(t.slice(0,m))+'<mark>'+esc(t.slice(m,i))+'</mark>'+esc(t.slice(i));return esc(t);}
  if(!toks.length)return esc(t);
  var marks=[];toks.forEach(function(k){var p=bt.indexOf(k);if(p>=0)marks.push([p,p+k.length]);});
  marks.sort(function(x,y){return x[0]-y[0];});
  marks.forEach(function(m){if(m[0]<i)return;out+=esc(t.slice(i,m[0]))+'<mark>'+esc(t.slice(m[0],m[1]))+'</mark>';i=m[1];});
  return out+esc(t.slice(i));
}
function wynikiSzuk(){
  var q=S.q;if(!q.trim())return '<div class="pusto">Wpisz nazwisko, numer telefonu (wystarczy kawałek)<br>albo ulicę lub dzielnicę.</div>';
  var r=D.items.filter(function(i){return pasuje(i,q);}).sort(function(a,b){return b.ts-a.ts;});
  return r.length?r.map(function(i){return karta(i,q);}).join(''):'<div class="pusto">Nic nie znalazłem dla „'+esc(q)+'”.</div>';
}

var pk=-1,przEl=null;
function przewodnik(start){
  if(start){pk=0;przEl=document.createElement('div');przEl.className='prz';przEl.innerHTML='<div class="dz-r"></div><div class="dym" role="dialog"></div>';document.body.appendChild(przEl);
    przEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.p==='pomin'){konPrz();}else if(b.dataset.p==='dalej'){pk++;if(pk>=KROKI.length)konPrz();else krok();}});}
  krok();
}
function konPrz(){if(przEl)przEl.remove();przEl=null;pk=-1;try{localStorage.setItem('spk-katalog-przew','1');}catch(e){}
  if(!DESK.matches&&(S.sel||S.dzien)){S.sel=null;S.dzien=null;}S.v='dzis';render();}
function krok(){
  var k=KROKI[pk];
  if(k.v==='det'){var pi=D.items.filter(czyNowe)[0]||D.items[0];if(!pi){pk++;if(pk>=KROKI.length){konPrz();return;}krok();return;}S.v='lista';S.sel=S.sel||pi.id;S.dzien=null;}
  else{S.v=k.v;if(k.kt)S.kt=k.kt;S.sel=null;S.dzien=null;}
  render();
  setTimeout(function(){
    var el=k.cel();if(!el||!przEl)return;
    var det=el.closest('.det-b');if(det)det.scrollTop=Math.max(0,el.offsetTop-120);else el.scrollIntoView({block:'center'});
    var r=el.getBoundingClientRect(),pad=6,W=window.innerWidth,H=window.innerHeight;
    var top=Math.max(r.top-pad,4),bot=Math.min(r.bottom+pad,H-4);
    var ram=przEl.querySelector('.dz-r');ram.style.left=(r.left-pad)+'px';ram.style.top=top+'px';ram.style.width=(r.width+pad*2)+'px';ram.style.height=(bot-top)+'px';
    var dy=przEl.querySelector('.dym');
    dy.innerHTML='<h4>'+k.t+'</h4><p>'+k.x+'</p><div class="bt"><span class="kr">'+(pk+1)+' z '+KROKI.length+'</span><button type="button" class="pmn" data-p="pomin">Pomiń</button><button type="button" class="pom" data-p="dalej">'+(pk===KROKI.length-1?'Zaczynam':'Dalej')+'</button></div>';
    var dh=dy.offsetHeight;
    var y=(bot+12+dh<H)?bot+12:Math.max(12,top-12-dh);
    if(y+dh>H-8)y=Math.max(12,H-dh-12);
    dy.style.top=y+'px';
    if(DESK.matches){var lx=Math.min(Math.max(16,r.left),W-376);dy.style.left=lx+'px';}
  },S.v==='lista'&&k.v==='det'&&!DESK.matches?330:60);
}

/* ---------- GRAFIK brygad ---------- */
var RODZAJE=['warstwa','mozaika','klepka','jodełka','egzotyk','schody','listwy','olejowanie','stabilizacja','malowanie ścian'];
var PALETA=[['#FFD60A','żółty'],['#FF8A00','pomarańczowy'],['#1E63D6','niebieski'],['#A8D8F5','błękitny'],['#B6FF1A','limonkowy (neon)'],['#2E9E3A','zielony trawiasty'],['#FF6FAE','różowy'],['#6B2A5E','śliwkowy (awaria)'],['#E0262B','czerwony']];
function hexRgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||'');var v=m?parseInt(m[1],16):0x888888;return [v>>16,(v>>8)&255,v&255];}
function lum(h){var w=[.2126,.7152,.0722];return hexRgb(h).reduce(function(a,x,i){x/=255;return a+w[i]*(x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));},0);}
/* kolor tekstu dobierany automatycznie: ciemny albo biały, ten z większym kontrastem */
function tekstNa(h){var L=lum(h);return (L+.05)/.0566>=1.05/(L+.05)?'#16120F':'#FFFFFF';}
S.gd=DZIS;S.gwyb=null;

function kaf(id){for(var i=0;i<D.graf.k.length;i++)if(D.graf.k[i].id===id)return D.graf.k[i];return null;}
function kolor(id){var G=D.graf;for(var i=0;i<G.kol.length;i++)if(G.kol[i].id===id)return G.kol[i];return G.kol[0]||{id:'',n:'',c:'#8A8178'};}
function kolK(k){return k.c||kolor(k.kol).c;}
function tekstKaf(k){return ((k.ul||'')+(k.mies?'/'+k.mies:'')+(k.m2?' ('+k.m2+')':'')+(k.info?' / '+k.info:'')).toUpperCase();}
function bryg(id){var G=D.graf;for(var i=0;i<G.br.length;i++)if(G.br[i].id===id)return G.br[i];return null;}
/* dni robocze pn-sb (niedziela pomijana) */
function niedz(s){return zIso(s).getDay()===0;}
function wdPlus(s,n){var d=zIso(s),k=n<0?-1:1,m=Math.abs(n);while(m>0){d=plus(d,k);if(d.getDay()!==0)m--;}if(d.getDay()===0)d=plus(d,1);return iso(d);}
function segi(k){var r=[];if(!k.od)return r;var d=zIso(k.od);if(d.getDay()===0)d=plus(d,1);for(var i=0;i<Math.max(1,k.dni||1);i++){r.push(iso(d));d=plus(d,1);if(d.getDay()===0)d=plus(d,1);}return r;}
function kafNa(s,b){var r=[];D.graf.k.forEach(function(k){if(k.br!==b||!k.od)return;var sg=segi(k),i=sg.indexOf(s);if(i>=0)r.push({k:k,i:i,n:sg.length});});return r;}
function rodzajZ(it){return (it.zakres||[]).join(' + ').toUpperCase();}
function naGrafikuZ(id){return D.graf.k.some(function(k){return k.zid===id;});}
function doRozpl(){
  var z=D.items.filter(function(i){return OTWARTE(i)&&!naGrafikuZ(i.id);}).sort(function(a,b){return b.ts-a.ts;}).map(function(i){return {t:'i',o:i};});
  var r=D.graf.k.filter(function(k){return !k.od||!k.br;}).map(function(k){return {t:'g',o:k};});
  return r.concat(z);
}
function syncZap(k){
  if(!k.zid)return;var it=item(k.zid);if(!it)return;
  if(k.od&&k.br){it.dz=k.od;if(it.st==='luzne'||it.st==='rozmowa'){it.st='termin';log(it,'Status: '+ST.termin.n);}log(it,'Grafik: '+(bryg(k.br)||{n:''}).n+', '+krotko(k.od)+(k.dni>1?' ('+k.dni+' dni)':''));}
  else{it.dz=null;log(it,'Zdjęto z grafiku');}
}
/* pola kafelka z zapytania: ulica i numer (+ miejscowość spoza Warszawy), mieszkanie, m2, info, telefon */
function polaZ(it){
  var mm=m2(it),cz=String(it.ul||'').split(','),ul=cz[0].trim().replace(/^(ul\.|al\.|os\.|pl\.)\s*/i,''),mi='',mt=ul.match(/(?:\s*\/\s*|\s+m\.\s*)([0-9A-Za-z]+)$/i);
  if(mt){mi=mt[1];ul=ul.slice(0,mt.index);}
  var miasto=cz.length>1?cz[cz.length-1].replace(/\d{2}-\d{3}/,'').trim():'';if(miasto&&!/^warszawa$/i.test(miasto))ul+=' '+miasto;
  return {ul:ul.toUpperCase(),mies:mi.toUpperCase(),m2:mm?String(mm):'',info:[it.ds,rodzajZ(it)].filter(Boolean).join(', ').toUpperCase(),tel:it.tel||''};
}
function naGrafik(it,s,b){
  var mm=m2(it),p=polaZ(it);
  var k={id:'k'+Date.now(),ul:p.ul,mies:p.mies,m2:p.m2,info:p.info,tel:it.tel,kol:(it.st==='termin'||it.st==='zatw'||it.st==='wtoku')?'ok':'mysli',c:'',br:b,od:s,dni:mm>100?3:mm>55?2:1,zid:it.id};
  if(kolor(k.kol).id!==k.kol)k.kol=D.graf.kol[0].id;
  D.graf.k.push(k);syncZap(k);zapisz();toast(tekstKaf(k).split(' / ')[0]+' → '+bryg(b).n+', '+krotko(s));
}
/* kopiuj/wklej kafelek (Artur 15.11): adres, mieszkanie, m2 i info; bez telefonu, statusu i powiązania z zapytaniem */
function wklej(celStr){
  var c=celStr.split('|'),s=c[0],b=c[1];if(!S.kop||!bryg(b))return;
  var k={id:'k'+Date.now(),ul:S.kop.ul,mies:S.kop.mies,m2:S.kop.m2,info:S.kop.info,tel:'',kol:(D.graf.kol[0]||{}).id,c:'',br:b,od:niedz(s)?wdPlus(s,0):s,dni:1,zid:null};
  D.graf.k.push(k);S.kop=null;zapisz();render(true);toast('Wklejono: '+tekstKaf(k).split(' / ')[0]+' → '+bryg(b).n+', '+krotko(k.od));
}
function dropGraf(kod,celStr){
  var c=celStr.split('|'),s=c[0],b=c[1],p=kod.split(':');
  var nb=b.indexOf('N:')===0;
  if(p[0]==='w'){if(b!=='S'&&!nb){toast('Sprawy przeciągasz pod kafelki albo do Spraw');return;}var w=wpis(p[1]);if(w){w.dz=s;if(nb)w.br=b.slice(2);else if(w.br)w.br='';zapisz();toast((nb?'Info → '+(bryg(w.br)||{n:''}).n+', ':'Sprawa → ')+krotko(s));}return;}
  if(b==='S'||nb){toast('Zlecenie upuść w kratce brygady');return;}
  if(p[0]==='i'){var it=item(p[1]);if(it)naGrafik(it,s,b);return;}
  if(p[0]==='g'){var k=kaf(p[1]);if(!k)return;var od=(k.od&&k.br)?wdPlus(s,-(+p[2]||0)):s;
    k.od=od;k.br=b;syncZap(k);zapisz();toast(tekstKaf(k).split(' / ')[0]+' → '+bryg(b).n+', '+krotko(od));}
}
function kafHtml(e){
  var k=e.k,c=kolK(k),st=kolor(k.kol);
  return '<div class="kf'+(e.i>0?' cd':'')+'" role="button" tabindex="0" style="--kc:'+c+';--kt:'+tekstNa(c)+'" data-act="kf" data-id="'+k.id+'" data-drag="g:'+k.id+':'+e.i+'">'+
    '<button type="button" class="kd" data-act="kkol" data-id="'+k.id+'" aria-label="Zmień kolor (teraz: '+esc(st.n)+')" title="Zmień kolor"></button>'+
    (e.n>1?'<i class="nd">dzień '+(e.i+1)+'/'+e.n+'</i>':'')+
    '<b>'+esc(tekstKaf(k))+'</b>'+(k.tel?'<span class="tl">'+esc(k.tel)+'</span>':'')+(k.c?'<span class="st-n">'+esc(st.n)+'</span>':'')+'</div>';
}
/* paleta kolorów pod kółkiem kafelka: status (z kolorem) albo sam kolor kafelka */
var palEl=null;
function zamknijPal(){if(palEl){palEl.remove();palEl=null;}document.removeEventListener('pointerdown',palZew,true);}
function palZew(e){if(palEl&&!palEl.contains(e.target))zamknijPal();}
function paleta(k,el){
