<style>.sms-box{grid-column:1/-1;background:#FFF6F0;border:1.5px dashed #F8580E;border-radius:12px;padding:14px 16px;margin-bottom:6px}
.sms-box b{display:block;font-size:.95rem;margin-bottom:4px}.sms-box p{font-size:.82rem;color:#6B5E52;margin:0 0 8px}
.sms-box textarea{width:100%;min-height:110px;font:inherit;font-size:.9rem}
.sms-box .sms-akcje{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sms-box button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#F8580E;color:#fff}
.sms-box button.sms-czysc{background:#EDE6DC;color:#3A3F45}
.sms-wynik{font-size:.82rem;margin-top:10px;line-height:1.5}.sms-wynik .ok{color:#1F7A4D}.sms-wynik .brak{color:#B23B1E}
.sms-podswietl{box-shadow:0 0 0 3px rgba(46,139,87,.45)!important;transition:box-shadow .3s}</style>
<script>
(function(){
  /* Artur 14.10 10:41: wklejam SMS klienta (1. adres 2. telefon 3. mail 4. zakres 5. pietro 6. termin 7. listwy 8. uwagi)
     do jednego okienka, a arkusz sam rozrzuca dane do ramek. Tylko w trybie parkieciarza (?parkieciarz). */
  var on=false; try{on=/[?&#]parkieciarz/.test(location.search+location.hash)||localStorage.getItem('spParkieciarz')==='1';}catch(e){}
  var f=document.querySelector('form.ai-form'); if(!on||!f)return;
  var box=document.createElement('div'); box.className='sms-box';
  box.innerHTML='<b>Wklej SMS lub wiadomość klienta</b><p>Wklej całą wiadomość tak, jak przyszła. Arkusz sam wpisze adres, telefon, e-mail, metraż, piętro, termin, listwy i uwagi do właściwych pól. Sprawdź je potem wzrokiem.</p>'+
    '<textarea id="smsWklej" placeholder="1. Niekłańska 42/19, Warszawa&#10;2. 601 484 540&#10;3. jan.kowalski@wp.pl&#10;4. pokój 10,5 m2, pokój 18 m2&#10;5. parter&#10;6. pomiędzy 12.10 - 16.10&#10;7. listwy - nie"></textarea>'+
    '<div class="sms-akcje"><button type="button" id="smsRozrzuc">Rozrzuć do pól</button><button type="button" class="sms-czysc" id="smsCzysc">Wyczyść</button></div><div class="sms-wynik" id="smsWynik"></div>';
  f.insertBefore(box,f.firstChild);

  var DZ=['Bemowo','Białołęka','Bielany','Mokotów','Ochota','Praga-Południe','Praga-Północ','Rembertów','Śródmieście','Targówek','Ursus','Ursynów','Wawer','Wesoła','Wilanów','Włochy','Wola','Żoliborz'];
  function bezOgonkow(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');}
  function ustaw(id,v){var e=document.getElementById(id); if(!e||v==null||v==='')return false; e.value=v;
    e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));
    e.classList.add('sms-podswietl');setTimeout(function(){e.classList.remove('sms-podswietl');},2500);return true;}
  function radio(n,v){var e=document.querySelector('input[name="'+n+'"][value="'+v+'"]'); if(!e)return false; e.checked=true;
    e.dispatchEvent(new Event('change',{bubbles:true}));return true;}
  function liczba(s){return parseFloat(String(s).replace(',','.'));}

  function parsuj(t){
    var txt=t.replace(/\r/g,'').replace(/ /g,' ').trim(), r={}, uwagi=[];
    // podzial na punkty "1. ...", "2) ..." (nie tnie dat typu 12.10)
    var seg=txt.split(/(?:^|\s)(?=\d{1,2}[.)]\s+[^\d\s])/).map(function(s){return s.trim();}).filter(Boolean);
    if(seg.length<2) seg=txt.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
    seg=seg.map(function(s){return s.replace(/^\d{1,2}[.)]\s+/,'');});
    var uzyte={};
    seg.forEach(function(s,i){
      var m;
      if(!r.mail&&(m=s.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/))){r.mail=m[0];if(s.replace(m[0],'').replace(/[\s,;:-]/g,'').length<3)uzyte[i]=1;}
      var tel=s.replace(/[\w.+-]+@\S+/,'').match(/(?:\+?48[\s-]?)?(\d{3})[\s-]?(\d{3})[\s-]?(\d{3})(?!\d)/);
      if(!r.tel&&tel){r.tel=tel[1]+' '+tel[2]+' '+tel[3]; if(s.replace(tel[0],'').replace(/[\s,;:.-]|tel|telefon/gi,'').length<3)uzyte[i]=1;}
      if(!r.kod&&(m=s.match(/\b\d{2}-\d{3}\b/)))r.kod=m[0];
    });
    seg.forEach(function(s,i){
      if(uzyte[i])return; var m;
      // adres: "ul. X 12/3, Miasto" albo "Niekłańska 42/19, Warszawa"
      if(!r.ulica&&(/\b(ul|al|os|pl)\.\s*\S/i.test(s)||/^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż.\-]+(\s[A-ZĄĆĘŁŃÓŚŹŻ]?[a-ząćęłńóśźż.\-]+)*\s\d+[a-zA-Z]?(\s*[\/m.]+\s*\d+)?\b/.test(s))&&!/m2|m²/i.test(s)){
        var cz=s.replace(/\b\d{2}-\d{3}\b/,'').split(',').map(function(x){return x.trim();}).filter(Boolean);
        r.ulica=cz[0]; if(cz[1])r.miasto=cz[1].replace(/^\d{2}-\d{3}\s*/,''); uzyte[i]=1; return;}
      // metraz: suma wszystkich "NN m2"
      var mm=s.match(/(\d+(?:[.,]\d+)?)\s*(?:m2|m²|mkw|m\.\s?kw|metr)/gi);
      if(mm){var suma=0,lista=[];mm.forEach(function(x){var v=liczba(x);if(!isNaN(v)){suma+=v;lista.push(String(v).replace('.',','));}});
        r.m2=(r.m2||0)+suma; r.m2lista=(r.m2lista||[]).concat(lista); uwagi.push(s); uzyte[i]=1;
        if(/wymian|napraw|ubyt|uszkodz/i.test(s))r.napr=true; if(/mozaik/i.test(s))r.typ='Mozaika'; else if(/warstw|deska/i.test(s))r.typ='Warstwowa'; else if(/klepk|jodeł|jodel|parkiet/i.test(s))r.typ=r.typ||'Klepka';
        return;}
      // pietro i winda
      if(/parter|pi[eę]tr|kondygn/i.test(s)){
        if(/parter/i.test(s))r.pietro=0; else if((m=s.match(/(\d+)\s*\.?\s*pi[eę]tr/i)||s.match(/pi[eę]tr\w*\s*(\d+)/i)))r.pietro=+m[1];
        if(/bez\s+windy|brak\s+windy|winda\s*[-:]?\s*(nie|brak)/i.test(s))r.winda='nie'; else if(/winda|wind[aąy]/i.test(s))r.winda='tak';
        if(s.replace(/parter|\d+\s*\.?\s*pi[eę]tro|pi[eę]tro\s*\d+|winda|bez windy|[-,.\s]/gi,'').length>2)uwagi.push(s);
        uzyte[i]=1;return;}
      if(!r.winda&&/bez\s+windy|brak\s+windy/i.test(s)){r.winda='nie';uzyte[i]=1;return;}
      // listwy
      if((m=s.match(/listw\w*\s*[-:]?\s*(nie|tak|mdf|klasyczn\w*|drewnian\w*|bez)/i))){
        var v=m[1].toLowerCase(); r.listwy=(v==='nie'||v==='bez')?'nie':(v==='mdf'?'MDF':'klasyczna');
        var mb=s.match(/(\d+(?:[.,]\d+)?)\s*(?:mb|m\.b|metr)/i); if(mb)r.listwyMb=liczba(mb[1]); uzyte[i]=1;return;}
      // termin
      if(/pomi[eę]dzy|termin|od\s+\d|do\s+\d|\b\d{1,2}\.\d{1,2}\b|stycz|lut|marz|kwie|maj|czerw|lip|sierp|wrze|pa[zź]dz|listop|grud|asap|jak najszybciej|od zaraz/i.test(s)&&!r.termin){
        r.termin=s.replace(/^termin\s*[-:]?\s*/i,''); uzyte[i]=1;return;}
      // imie i nazwisko
      if(!r.imie&&((m=s.match(/^(?:imi[eę]|nazwisko|imi[eę] i nazwisko)\s*[-:]?\s*(.+)$/i))||(/^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż\-]+$/.test(s)&&(m=[0,s])))){r.imie=m[1];uzyte[i]=1;return;}
    });
    seg.forEach(function(s,i){if(!uzyte[i])uwagi.push(s);});
    var calosc=bezOgonkow(txt);
    DZ.forEach(function(d){if(!r.dziel&&calosc.indexOf(bezOgonkow(d))>=0)r.dziel=d;});
    if(/\bdom\b|domu\b/i.test(txt))r.obiekt='Dom'; else if(/mieszkani/i.test(txt))r.obiekt='Mieszkanie'; else if(/lokal|biur/i.test(txt))r.obiekt='Lokal usługowy';
    if(!r.napr&&/napraw|ubyt|uszkodz|wymian/i.test(txt))r.napr=true;
    r.uwagi=uwagi.join('\n');
    return r;
  }

  document.getElementById('smsCzysc').onclick=function(){document.getElementById('smsWklej').value='';document.getElementById('smsWynik').innerHTML='';};
  document.getElementById('smsRozrzuc').onclick=function(){
    var t=document.getElementById('smsWklej').value; if(!t.trim())return;
    var r=parsuj(t), ok=[], brak=[];
    function zapisz(nazwa,cond){(cond?ok:brak).push(nazwa);}
    zapisz('adres',ustaw('ulicaKl',r.ulica));
    if(r.miasto)ustaw('miastoKl',r.miasto); if(r.kod)ustaw('kodKl',r.kod);
    zapisz('telefon',ustaw('telKl',r.tel));
    zapisz('e-mail',ustaw('mailKl',r.mail));
    if(r.m2){var m2=document.getElementById('m2'); if(m2)m2.step='any';}
    zapisz('metraż'+(r.m2lista&&r.m2lista.length>1?' ('+r.m2lista.join(' + ')+')':''),ustaw('m2',r.m2?Math.round(r.m2*10)/10:''));
    zapisz('piętro',r.pietro!=null&&ustaw('pietroKl',r.pietro));
    if(r.winda)radio('winda',r.winda);
    zapisz('termin',ustaw('terminKl',r.termin));
    zapisz('listwy',!!r.listwy&&radio('listwy',r.listwy)); if(r.listwyMb)ustaw('listwyMb',r.listwyMb);
    if(r.imie)ustaw('imieKl',r.imie);
    if(r.dziel)ustaw('dzielKl',r.dziel);
    if(r.obiekt)ustaw('obiektKl',r.obiekt);
    if(r.typ)ustaw('typ',[].slice.call((document.getElementById('typ')||{options:[]}).options).filter(function(o){return o.text===r.typ;}).map(function(o){return o.value;})[0]);
    if(r.napr)radio('napr','tak');
    if(r.uwagi){var u=document.getElementById('uwagiKl'); if(u){u.value=(u.value?u.value+'\n':'')+r.uwagi;u.dispatchEvent(new Event('input',{bubbles:true}));u.classList.add('sms-podswietl');setTimeout(function(){u.classList.remove('sms-podswietl');},2500);}}
    document.getElementById('smsWynik').innerHTML='<span class="ok">Wpisane: '+ok.join(', ')+'.</span>'+(brak.length?'<br><span class="brak">Nie znalazłem: '+brak.join(', ')+' - uzupełnij ręcznie.</span>':'')+(r.uwagi?'<br>Reszta wiadomości trafiła do pola "Uwagi / prace dodatkowe".':'');
  };
  window.spParsujSms=parsuj;
})();
</script>
