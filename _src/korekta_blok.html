<style>/* kolor kalkulatora 14.10 (Artur: "pokolorowac, dodac pomaranczowego" - wzor: formularz z jego starej strony) */
#wycena{background:linear-gradient(160deg,#F8580E 0%,#EE6A1F 55%,#E8671F 100%)!important}
#wycena .sticky h2,#wycena .sticky .lead,#wycena .sticky p{color:#fff!important}
#wycena .sticky .oczko{color:#FFE3D2!important}#wycena .sticky .oczko span{background:#fff!important}
#wycena .ai{border:0!important;border-radius:16px!important;box-shadow:0 18px 50px rgba(120,40,0,.28)}
#wycena .ai-form{background:#fff!important}
#wycena .ai-form .sekcja-form{color:#E8580E!important;font-size:1.05rem!important;border-top:2px solid #FBD3BE!important}
#wycena .ai-form .sekcja-form:after{content:"";display:block;width:44px;height:3px;background:#F8580E;border-radius:2px;margin-top:8px}
#wycena .ai-form label,#wycena .ai-form .pyt>span{color:#D9480F!important}
#wycena .ai-form select:focus,#wycena .ai-form input:focus,#wycena .ai-form textarea:focus{border-color:#F8580E!important;outline:0;box-shadow:0 0 0 3px rgba(248,88,14,.18)}
#wycena .ai-form input[type=radio]{accent-color:#F8580E}
#wycena .drop{background:#FFF6F0!important;border-color:#F8A27A!important}
.popraw-btn{grid-column:1/-1;margin-top:10px;border:2px solid #F8580E;background:#fff;color:#E8580E;font-weight:800;border-radius:10px;padding:14px 18px;cursor:pointer;font-size:1rem}
.wyc-hist{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}.wyc-hist select{flex:1;min-width:0}
</style>
<script>
(function(){
  /* Artur 14.10 12:22: po wyslaniu chce dopisac cos i wyslac jeszcze raz bez wypelniania od nowa,
     a w trakcie negocjacji wracac do wczesniejszych wycen. Historia zapisuje sie TYLKO w telefonie parkieciarza
     (localStorage, tryb ?parkieciarz) - nigdzie publicznie, wiec dane klientow nie wisza w sieci. */
  var on=false; try{on=/[?&#]parkieciarz/.test(location.search+location.hash)||localStorage.getItem('spParkieciarz')==='1';}catch(e){}
  var POLA=['m2','typ','wyk','gatKl','montazKl','listwyMb','stabM2','terminKl','uwagiKl','imieKl','ulicaKl','kodKl','miastoKl','dzielKl','obiektKl','pietroKl','telKl','mailKl'];
  var RADIA=['listwy','stab','napr','meble','winda'];
  function zrzut(){var s={pola:{},radia:{},dod:[]};
    POLA.forEach(function(id){var e=document.getElementById(id);if(e)s.pola[id]=e.value;});
    RADIA.forEach(function(n){var e=document.querySelector('input[name="'+n+'"]:checked');if(e)s.radia[n]=e.value;});
    [].slice.call(document.querySelectorAll('#dodLista .dod-w')).forEach(function(w){s.dod.push([w.querySelector('.dod-o').value,w.querySelector('.dod-i').value,w.querySelector('.dod-j').value,w.querySelector('.dod-c').value]);});
    return s;}
  function wczytaj(s){
    Object.keys(s.pola||{}).forEach(function(id){var e=document.getElementById(id);if(e){e.value=s.pola[id];e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));}});
    Object.keys(s.radia||{}).forEach(function(n){var e=document.querySelector('input[name="'+n+'"][value="'+s.radia[n]+'"]');if(e){e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}));}});
    var li=document.getElementById('dodLista'),plus=document.getElementById('dodPlus');
    if(li&&plus&&s.dod){[].slice.call(li.querySelectorAll('.dod-w')).forEach(function(w){w.remove();});
      (s.dod.length?s.dod:[['','1','szt.','']]).forEach(function(r){plus.click();var w=[].slice.call(li.querySelectorAll('.dod-w')).pop();
        w.querySelector('.dod-o').value=r[0];w.querySelector('.dod-i').value=r[1];w.querySelector('.dod-j').value=r[2];w.querySelector('.dod-c').value=r[3];
        w.querySelector('.dod-c').dispatchEvent(new Event('input',{bubbles:true}));});}
    window.__korekta=true;}
  function hist(){try{return JSON.parse(localStorage.getItem('spWyceny')||'[]');}catch(e){return [];}}
  window.spZapiszWycene=function(){if(!on)return;try{var h=hist(),s=zrzut();
    s.kiedy=new Date().toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    s.opis=[s.pola.ulicaKl||'bez adresu',(s.pola.m2||'?')+' m²',s.pola.telKl||''].filter(Boolean).join(', ');
    h=h.filter(function(x){return !(x.pola&&x.pola.telKl===s.pola.telKl&&x.pola.ulicaKl===s.pola.ulicaKl);});
    h.unshift(s);localStorage.setItem('spWyceny',JSON.stringify(h.slice(0,20)));rysujListe();}catch(e){}};
  function rysujListe(){var box=document.querySelector('.sms-box');if(!box)return;var w=document.getElementById('wycHist');
    var h=hist();if(!h.length){if(w)w.remove();return;}
    if(!w){w=document.createElement('div');w.id='wycHist';w.className='wyc-hist';box.insertBefore(w,box.firstChild);}
    w.innerHTML='<select id="wycHistSel" aria-label="Wcześniejsze wyceny"><option value="">Wczytaj wcześniejszą wycenę do poprawki…</option>'+
      h.map(function(x,i){return '<option value="'+i+'">'+(x.kiedy||'')+' · '+String(x.opis||'').replace(/</g,'')+'</option>';}).join('')+'</select>';
    document.getElementById('wycHistSel').onchange=function(){var i=this.value;if(i==='')return;wczytaj(hist()[+i]);
      var wy=document.getElementById('smsWynik');if(wy)wy.innerHTML='<span class="ok">Wczytana wycena z '+(hist()[+i].kiedy||'')+'. Popraw, co trzeba, i wyślij ponownie. Zdjęcia trzeba dodać jeszcze raz, jeśli mają iść w mailu.</span>';};}
  if(on){if(document.readyState!=='loading')rysujListe();else document.addEventListener('DOMContentLoaded',rysujListe);}

  /* przycisk "Popraw i wyślij ponownie" po udanej wysylce (dla wszystkich - klient tez moze cos dopisac) */
  window.spPokazPopraw=function(){var bw=document.getElementById('wyslij');if(!bw||document.getElementById('poprawBtn'))return;
    var b=document.createElement('button');b.type='button';b.id='poprawBtn';b.className='popraw-btn';b.textContent='✎ Popraw i wyślij ponownie';
    b.onclick=function(){bw.classList.remove('wyslane');bw.disabled=false;bw.removeAttribute('style');bw.innerHTML=bw.dataset.oryg||'Wyślij do bezpłatnej wyceny';
      window.__korekta=true;b.remove();var f=document.querySelector('form.ai-form');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});};
    bw.parentNode.insertBefore(b,bw.nextSibling);};
  var bw0=document.getElementById('wyslij');if(bw0&&!bw0.dataset.oryg)bw0.dataset.oryg=bw0.innerHTML;
})();
</script>
