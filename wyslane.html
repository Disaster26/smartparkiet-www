<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zgłoszenie wysłane - SMARTPARKIET</title>
<!-- Strona potwierdzenia dla formularza wyceny. Ladowana w ukrytej ramce zaraz
     po wyslaniu kalkulacji, dlatego jest celowo lekka: zadnych skryptow, zdjec
     ani zewnetrznych arkuszy. Jesli ktos trafi tu bezposrednio, widzi normalne
     podziekowanie i droge powrotna. -->
<style>
  :root{--kosc:#FAF7F2;--grafit:#1A1512;--grafit2:#5B524B;--pom:#F8580E;--kreska:#E3DCD2}
  *{box-sizing:border-box}
  body{margin:0;padding:48px 20px;background:var(--kosc);color:var(--grafit);
    font:16px/1.6 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
  .k{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--kreska);
    border-left:3px solid var(--pom);border-radius:3px;padding:30px 28px}
  h1{margin:0 0 14px;font-size:1.3rem;line-height:1.25}
  p{margin:0 0 14px;color:var(--grafit2)}
  a.b{display:inline-block;margin-top:8px;padding:12px 20px;border-radius:2px;
    background:var(--pom);color:#fff;text-decoration:none;font-weight:700}
  a.g{display:inline-block;margin:8px 0 0 10px;padding:12px 20px;border-radius:2px;
    border:1px solid var(--kreska);color:var(--grafit);text-decoration:none}
</style>
</head>
<body>
  <div class="k">
    <h1>Zgłoszenie dotarło do naszego biura</h1>
    <p>Dziękujemy. Kalkulacja razem ze zdjęciem podłogi jest już u nas.
    Odpowiadamy zwykle w ciągu dwóch godzin roboczych.</p>
    <p>Jeśli sprawa jest pilna, prosimy o telefon: <b>602 242 815</b> albo <b>606 949 222</b>.</p>
    <a class="b" href="index.html">Wróć na stronę główną</a>
    <a class="g" href="realizacje.html">Zobacz realizacje</a>
  </div>
</body>
</html>
