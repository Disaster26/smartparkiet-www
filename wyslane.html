<title>Zgłoszenie wysłane - SMARTPARKIET</title>

<style>

    background:var(--pom);color:#fff;text-decoration:none;font-weight:700}
  a.g{display:inline-block;margin:8px 0 0 10px;padding:12px 20px;border-radius:2px;
    border:1px solid var(--kreska);color:var(--grafit);text-decoration:none}
</style>
</head>
<body>
  <div class="k">
    <h1>Zgłoszenie dotarło do naszego biura</h1>
    <p>Dziękujemy. Kalkulacja razem ze zdjęciem podłogi jest już u nas.

    <p>Jeśli sprawa jest pilna, prosimy o telefon: <b>602 242 815</b> albo <b>606 949 222</b>.</p>
